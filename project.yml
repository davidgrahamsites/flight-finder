name: FlightFinder
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: 0.9.3
    DEVELOPMENT_TEAM: ""
targets:
  FlightFinder:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FlightFinderApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.flightfinder
        PRODUCT_NAME: FlightFinder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightFinder
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - FlightFinderTests

  FlightFinderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FlightFinderTests
    dependencies:
      - target: FlightFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.flightfinder.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
